name: Publish bundled source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source archive
        run: |
          rm -rf /tmp/ahkl-src
          mkdir -p /tmp/ahkl-src
          unzip -q AHKL-source.zip -d /tmp/ahkl-src
          find /tmp/ahkl-src -type d -name __pycache__ -prune -exec rm -rf {} +
          src=/tmp/ahkl-src/AHKL
          test -d "$src"
          cp -a "$src"/. .
          rm -f AHKL-source.zip AHKL-source.tar.gz

      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: publish actual source tree"
          git push
